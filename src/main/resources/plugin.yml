name: GlowChat
version: '${project.version}'
main: pluginsfix.glowchat.GlowChat
api-version: '1.16'
prefix: GlowChat
authors: [pluginsfix, talixty]
description: Simple, optimized and functional chat plugin with MiniMessage support
website: https://t.me/vibestudiomc

commands:
  chat:
    description: Main command for GlowChat
    aliases:
      - glowchat
      - gc
    usage: /<command> [reload]
  chatmode:
    description: Toggle chat mode between global and local
    permission: glowchat.chatmode
    aliases:
      - mode
      - cm
    usage: /<command>
  ac:
    description: Send message to Admin Chat
    permission: glowchat.adminchat
    aliases:
      - adminchat
      - a
    usage: /<command> <message>
  mc:
    description: Send message to Mod Chat
    permission: glowchat.modchat
    aliases:
      - modchat
      - m
    usage: /<command> <message>
  dc:
    description: Send message to Donor Chat
    permission: glowchat.donorchat
    aliases:
      - donorchat
      - d
    usage: /<command> <message>

permissions:
  glowchat.reload:
    description: Allows reloading GlowChat configuration
    default: op
  glowchat.chatmode:
    description: Allows toggling chat mode
    default: true
  glowchat.adminchat:
    description: Allows using and seeing Admin Chat
    default: op
  glowchat.modchat:
    description: Allows using and seeing Mod Chat
    default: op
  glowchat.donorchat:
    description: Allows using and seeing Donor Chat
    default: false
  glowchat.color.mercury:
    description: Mercury message color
    default: false
  glowchat.color.moon:
    description: Moon message color
    default: false
  glowchat.color.mars:
    description: Mars message color
    default: false
  glowchat.color.admin:
    description: Admin message color
    default: false
  glowchat.color.gold:
    description: Gold message color
    default: false
  glowchat.color.silver:
    description: Silver message color
    default: false
  glowchat.color.bronze:
    description: Bronze message color
    default: false
